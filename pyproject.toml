[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingdyor"
version = "0.1.0"
description = "Evidence-driven, continuously evaluated equity research and decision-support platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pandas>=2.2",
  "numpy>=2.0",
  "yfinance>=0.2.54",
  "httpx>=0.27",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "streamlit>=1.38",
  "plotly>=5.24",
  "scikit-learn>=1.5",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["tradingdyor*"]

[tool.ruff]
line-length = 100
target-version = "py311"
