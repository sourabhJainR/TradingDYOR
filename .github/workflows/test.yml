name: TradingDYOR CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agents/package.json
      - working-directory: agents
        run: npm install
      - working-directory: agents
        run: node --check src/runner.js
      - run: node scripts/check_ui.js

  auren-runtime-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out TradingDYOR
        uses: actions/checkout@v4
      - name: Check out pinned AUREN implementation
        uses: actions/checkout@v4
        with:
          repository: sourabhJainR/AUREN
          ref: 0340a56658f0d9d31dc22a32405f88bd792ca9f6
          path: .auren-under-test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cross-domain AUREN runtime tests
        env:
          AUREN_ROOT: ${{ github.workspace }}/.auren-under-test
        run: python -m unittest discover -s experiments/auren_runtime_delivery -p 'test_*.py' -v
