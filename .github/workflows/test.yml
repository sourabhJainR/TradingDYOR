name: TradingDYOR CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agents/package.json
      - working-directory: agents
        run: npm install
      - working-directory: agents
        run: node --check src/runner.js
      - run: node scripts/check_ui.js

  auren-runtime-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out TradingDYOR
        uses: actions/checkout@v4
      - name: Check out pinned AUREN optimizer implementation
        uses: actions/checkout@v4
        with:
          repository: sourabhJainR/AUREN
          ref: 09955776eefd361cde29a8bf4dc6ab969f690075
          path: .auren-optimizer-under-test
      - name: Verify exact AUREN optimizer revision
        run: test "$(git -C .auren-optimizer-under-test rev-parse HEAD)" = "09955776eefd361cde29a8bf4dc6ab969f690075"
      - name: Check out pinned AUREN runtime implementation
        uses: actions/checkout@v4
        with:
          repository: sourabhJainR/AUREN
          ref: 09955776eefd361cde29a8bf4dc6ab969f690075
          path: .auren-under-test
      - name: Verify exact AUREN runtime revision
        run: test "$(git -C .auren-under-test rev-parse HEAD)" = "09955776eefd361cde29a8bf4dc6ab969f690075"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TradingDYOR application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run AUREN optimizer and rubric trust-boundary tests
        run: |
          cd .auren-optimizer-under-test
          python -m unittest -v tests.test_quality_optimizer_contract tests.test_evaluation_rubric tests.test_agency_quality
          python -m unittest discover -s .ai-harness/tests -p 'test_context_cache.py' -v
          PYTHONPATH=. python -m pytest tests/test_context_broker.py tests/test_local_composition.py -q
          PYTHONPATH=. python -m pytest tests/test_auto_compaction_protected_budget.py tests/test_hybrid_model_router.py -q
      - name: Run cross-domain AUREN runtime tests
        env:
          AUREN_ROOT: ${{ github.workspace }}/.auren-under-test
          AUREN_REVISION: 09955776eefd361cde29a8bf4dc6ab969f690075
        run: |
          python -m unittest discover -s experiments/auren_runtime_delivery -p 'runtime_*_contract.py' -v
          pip install pytest
          PYTHONPATH="${{ github.workspace }}/.auren-under-test" python -m pytest .auren-under-test/tests/test_dashboard_chunked_delivery.py -q
