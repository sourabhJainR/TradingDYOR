name: AUREN Runtime Delivery Test Bed

on:
  pull_request:
    paths:
      - "experiments/auren_runtime_delivery/**"
      - ".github/workflows/auren-runtime-delivery-testbed.yml"
  push:
    branches: [main]
    paths:
      - "experiments/auren_runtime_delivery/**"
      - ".github/workflows/auren-runtime-delivery-testbed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auren-delivery-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out TradingDYOR
        uses: actions/checkout@v4
      - name: Check out pinned AUREN implementation
        uses: actions/checkout@v4
        with:
          repository: sourabhJainR/AUREN
          ref: 09955776eefd361cde29a8bf4dc6ab969f690075
          path: .auren-under-test
      - name: Verify exact AUREN revision
        run: test "$(git -C .auren-under-test rev-parse HEAD)" = "09955776eefd361cde29a8bf4dc6ab969f690075"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TradingDYOR application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run AUREN supervisor, crew, approval and recovery acceptance suites
        run: |
          cd .auren-under-test
          python -m unittest -v \
            tests.test_trusted_plan_dispatch \
            tests.test_durable_approval \
            tests.test_execution_controller_cancellation \
            tests.test_graph_agent_team_crew_dispatch \
            tests.test_graph_agent_crews \
            tests.test_graph_worker_lifecycle \
            tests.test_state_migration \
            tests.test_agent_org_contract \
            tests.test_container_sandboxed_arena_integration
      - name: Run AUREN repository execution preflight contracts
        run: |
          cd .auren-under-test
          python -m unittest -v tests.test_repository_execution_preflight
      - name: Run AUREN CLI and sink delivery contracts
        run: |
          python -m pip install pytest
          cd .auren-under-test
          python -m pytest -q tests/test_response_delivery_sinks.py
