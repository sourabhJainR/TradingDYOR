name: AUREN Runtime Delivery Test Bed

on:
  pull_request:
    paths:
      - "experiments/auren_runtime_delivery/**"
      - ".github/workflows/auren-runtime-delivery-testbed.yml"
  push:
    branches: [main]
    paths:
      - "experiments/auren_runtime_delivery/**"
      - ".github/workflows/auren-runtime-delivery-testbed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auren-delivery-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out TradingDYOR
        uses: actions/checkout@v4
      - name: Check out pinned AUREN implementation
        uses: actions/checkout@v4
        with:
          repository: sourabhJainR/AUREN
          ref: f075961906c50a048a1e071a9c371f5c13e08ca9
          path: .auren-under-test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cross-domain AUREN runtime tests
        env:
          AUREN_ROOT: ${{ github.workspace }}/.auren-under-test
        run: python -m unittest discover -s experiments/auren_runtime_delivery -p 'runtime_*_contract.py' -v
